name: Observation Test Runtime

"on":
  workflow_dispatch:
    inputs:
      mode:
        description: "Isolated test bucket only; boundary/full require Sunday 19:00-20:00 KST"
        type: choice
        required: true
        default: validate
        options: [validate, pool, boundary, verify, full]
      confirm_isolated_bucket:
        description: "Confirm observation-r2-test Environment and dedicated test credentials"
        type: boolean
        required: true
        default: false
      repositories:
        description: "Optional public owner/repo names, comma separated (max 8); otherwise current Trending discovery"
        type: string
        default: ""
      cleanup_current_run:
        description: "Delete only this run's acknowledged objects after verification (default retains observations)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: github-weekly-report-observation-test-runtime
  cancel-in-progress: false
  queue: max

defaults:
  run:
    shell: bash

jobs:
  validate:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'validate' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Offline interface validation
        run: python scripts/run_observation_test_once.py --summary "$GITHUB_STEP_SUMMARY"
      - name: Offline runtime integration tests
        run: python -m pytest tests/test_observation_test_runtime.py -q

  isolated-live:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode != 'validate' }}
    environment: observation-r2-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require confirmation before injecting credentials
        env:
          CONFIRMED: ${{ inputs.confirm_isolated_bucket }}
        run: |
          if [ "$CONFIRMED" != "true" ]; then
            echo "EXPLICIT_ISOLATED_BUCKET_CONFIRMATION_REQUIRED"
            exit 1
          fi
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Run isolated observation mode
        env:
          OBS_MODE: ${{ inputs.mode }}
          OBS_REPOSITORIES: ${{ inputs.repositories }}
          OBS_CLEANUP: ${{ inputs.cleanup_current_run }}
          OBS_R2_ENDPOINT: ${{ secrets.OBS_R2_ENDPOINT }}
          OBS_R2_ACCESS_KEY_ID: ${{ secrets.OBS_R2_ACCESS_KEY_ID }}
          OBS_R2_SECRET_ACCESS_KEY: ${{ secrets.OBS_R2_SECRET_ACCESS_KEY }}
          OBS_R2_BUCKET: ${{ secrets.OBS_R2_BUCKET }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          args=(--mode "$OBS_MODE" --confirm-isolated-bucket --repositories "$OBS_REPOSITORIES" --summary "$GITHUB_STEP_SUMMARY")
          if [ "$OBS_CLEANUP" = "true" ]; then args+=(--cleanup-current-run); fi
          python scripts/run_observation_test_once.py "${args[@]}"
