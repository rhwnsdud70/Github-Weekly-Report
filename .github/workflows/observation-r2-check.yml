name: Observation R2 Connectivity Check

"on":
  workflow_dispatch:
    inputs:
      mode:
        description: "Offline validate or isolated test-bucket live check"
        type: choice
        required: true
        default: validate
        options: [validate, live]
      confirm_isolated_bucket:
        description: "Confirm dedicated test bucket and dedicated credentials; no production access"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: github-weekly-report-observation-r2-check
  cancel-in-progress: false
  queue: max

defaults:
  run:
    shell: bash

jobs:
  validate:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'validate' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Validate interfaces offline
        run: python scripts/check_observation_r2.py --mode validate --summary "$GITHUB_STEP_SUMMARY"
      - name: Run isolated probe and workflow Mock tests
        run: python -m pytest tests/test_observation_r2_check.py -q

  live:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'live' }}
    environment: observation-r2-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require explicit isolated-bucket confirmation
        env:
          CONFIRMED: ${{ inputs.confirm_isolated_bucket }}
        run: |
          if [ "$CONFIRMED" != "true" ]; then
            echo "EXPLICIT_ISOLATED_BUCKET_CONFIRMATION_REQUIRED"
            exit 1
          fi
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Check dedicated R2 test bucket
        env:
          OBS_R2_ENDPOINT: ${{ secrets.OBS_R2_ENDPOINT }}
          OBS_R2_ACCESS_KEY_ID: ${{ secrets.OBS_R2_ACCESS_KEY_ID }}
          OBS_R2_SECRET_ACCESS_KEY: ${{ secrets.OBS_R2_SECRET_ACCESS_KEY }}
          OBS_R2_BUCKET: ${{ secrets.OBS_R2_BUCKET }}
        run: >-
          python scripts/check_observation_r2.py --mode live --confirm-isolated-bucket
          --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
          --summary "$GITHUB_STEP_SUMMARY"
