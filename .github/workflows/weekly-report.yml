name: GitHub Weekly Report

"on":
  workflow_dispatch:
    inputs:
      mode:
        description: "validate checks configuration offline; production sends a real report"
        required: true
        default: validate
        type: choice
        options:
          - validate
          - production
  # Automatic production is DISABLED until manual validation and production verification.
  # To enable, uncomment all three lines below in a reviewed activation change.
  # schedule:
  #   - cron: "0 19 * * 0"
  #     timezone: "Asia/Seoul"

permissions:
  contents: read

# Must cover restore -> production run -> final upload, including manual dispatches.
concurrency:
  group: github-weekly-report-production
  cancel-in-progress: false
  queue: max

defaults:
  run:
    shell: bash

jobs:
  weekly-report:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_PATH: data/github_weekly_report.db
      TIMEZONE: Asia/Seoul
      OPENAI_MODEL: gpt-4.1-mini
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        id: dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Validate deployment configuration without API calls
        id: configuration
        env:
          GITHUB_TOKEN: ${{ secrets.GH_API_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python scripts/validate_weekly_deployment.py

      - name: Run offline regression tests
        id: tests
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'validate' }}
        run: |
          python -m compileall -q config collectors database models services telegram scripts main.py
          python -m pytest -q

      - name: Run production once
        id: production
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'production') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_API_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python scripts/run_weekly_live_once.py

      # No upload-artifact step: .env, SQLite/WAL/SHM, raw logs and evidence stay off artifacts.
      # This summary contains ONLY fixed step outcomes, never file contents or secrets.
      - name: Summarize step outcomes
        if: ${{ always() }}
        env:
          DEPENDENCIES_OUTCOME: ${{ steps.dependencies.outcome }}
          CONFIGURATION_OUTCOME: ${{ steps.configuration.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          PRODUCTION_OUTCOME: ${{ steps.production.outcome }}
        run: |
          {
            echo '## GitHub Weekly Report'
            echo "- Dependencies: ${DEPENDENCIES_OUTCOME}"
            echo "- Offline configuration: ${CONFIGURATION_OUTCOME}"
            echo "- Offline regression tests: ${TESTS_OUTCOME}"
            echo "- Production runner: ${PRODUCTION_OUTCOME}"
            echo '- Diagnostic artifact upload: disabled. Production database persistence uses R2 only.'
            echo '- Inspect the runner console for period, claim, pipeline, SQLite and R2 upload status.'
            echo '- After a production failure/cancellation/timeout, verify remote claims and delivery before rerunning. Local database/log files are not retained by this workflow.'
          } >> "$GITHUB_STEP_SUMMARY"
